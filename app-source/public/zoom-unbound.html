<html lang="en"><head><title>Join Joseph on Zoom</title><meta name="description" content="Join Joseph Cancilla on Zoom. Unbound Mind." /><meta property="og:title" content="Join Joseph on Zoom" /><meta property="og:description" content="Join Joseph Cancilla on Zoom. Unbound Mind." /><meta property="og:url" content="https://zoom.unboundmind.ai" /><meta property="og:site_name" content="Unbound Mind" /><meta property="og:image" content="https://zoom.unboundmind.ai/og-zoom-unbound.png" /><meta property="og:image:width" content="1200" /><meta property="og:image:height" content="630" /><meta property="og:image:alt" content="Join Joseph on Zoom" /><meta property="og:type" content="website" /><meta name="twitter:card" content="summary_large_image" /><meta name="twitter:title" content="Join Joseph on Zoom" /><meta name="twitter:image" content="https://zoom.unboundmind.ai/og-zoom-unbound.png" /><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex" /><meta name="theme-color" content="#EBDCBF" /><style>
  :root { --ivory: #EBDCBF; --shell: #FAF3E4; --ink: #1F2421; --muted: #625B50; --gold: #C29A52; --teal: #2F6F6A; --teal-dark: #244F4B; --line: #CBB694; }

      radial-gradient(circle at 15% 85%, rgba(194, 154, 82, 0.08), rgba(0, 0, 0, 0) 36%),

  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.12; letter-spacing: -0.01em; color: var(--ink); max-width: 16ch; }
  .ub-sub { font-size: clamp(0.98rem, 1.4vw, 1.12rem); line-height: 1.55; color: var(--muted); max-width: 34rem; }
  .ub-links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 0.6rem; }
  .ub-btn { display: inline-block; text-decoration: none; font-size: 0.86rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 6px; padding: 0.95rem 1.6rem; border: 1px solid var(--teal); color: var(--teal-dark); background: rgba(250, 243, 228, 0.7); transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
